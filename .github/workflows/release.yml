name: Release

# Fork change: a release no longer needs a hand-pushed tag. Merging a commit
# that changes the version in src-tauri/tauri.conf.json publishes that
# version — the release, its tag and the installers — on its own. Two
# fallbacks remain: pushing a `v*` tag by hand (upstream's way), and running
# this workflow by hand from the Actions tab on main.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a second one waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide what to publish, if anything. The version in tauri.conf.json is the
  # single source of truth: the tag is always `v` + that version.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to check that a hand-pushed tag sits on main.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "$REF_TYPE" == "tag" ]]; then
            # A hand-pushed tag must name the version it points at, or the
            # installers would carry a different number than the release.
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "::error::Tag ${REF_NAME} does not match version ${version} in tauri.conf.json"
              exit 1
            fi
            # A tag on a branch that never went through review must not reach
            # every installed copy through the updater.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "::error::Tag ${REF_NAME} points at a commit that is not on main"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are made from main only (this run is on ${REF})"
            exit 1
          fi

          # Already published (by hand, or by an earlier run): nothing to do.
          # This is also what keeps an unrelated edit to tauri.conf.json from
          # publishing anything.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${tag} from ${GITHUB_SHA}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Official builds bake in the maintainer's OAuth client ids; forks
          # without these secrets still build, but the Google/Microsoft sign-in
          # buttons stay hidden (set the env vars before building to enable them).
          SKIM_GOOGLE_CLIENT_ID: ${{ secrets.SKIM_GOOGLE_CLIENT_ID }}
          SKIM_GOOGLE_CLIENT_SECRET: ${{ secrets.SKIM_GOOGLE_CLIENT_SECRET }}
          SKIM_MICROSOFT_CLIENT_ID: ${{ secrets.SKIM_MICROSOFT_CLIENT_ID }}
          # Updater artifact signing. With createUpdaterArtifacts enabled the
          # build FAILS without these — forks must bring their own keypair or
          # drop the updater config from tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # When the tag does not exist yet it is created here, on the commit
          # being built. A tag made with GITHUB_TOKEN starts no further runs.
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "PCG Mail ${{ needs.prepare.outputs.tag }}"
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          # A full release, so the in-app updater (which reads the latest
          # release) offers it.
          prerelease: false
          # latest.json must point auto-updaters at the NSIS installer; the
          # default here is the MSI, which would silently migrate everyone.
          updaterJsonPreferNsis: true

      # The updater reads signatures from latest.json (embedded there in
      # full); the standalone .sig assets are never fetched — drop them to
      # keep the release page down to setup.exe + msi + latest.json.
      - name: Drop .sig assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG --json assets -q '.assets[].name' |
            Select-String '\.sig$' | ForEach-Object {
              gh release delete-asset $env:TAG $_.Line --yes
            }

  # Scoop ships the NSIS installer — the same per-user .exe the site links to,
  # and the one the in-app updater knows how to apply. The .msi stays a manual
  # download for managed environments.

  scoop:
    needs: [prepare, build]
    # Upstream-only: this fork ships through its own releases + in-app updater,
    # not Scoop, and must not push manifest commits to its main.
    if: github.repository == 'nikserg/skim'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # main requires a pull request, and GitHub offers no way to exempt
      # github-actions[bot] on a user-owned repo — so this pushes as the
      # maintainer, who is exempt (branch protection has enforce_admins off).
      # Forks fall back to the stock token and their own unprotected branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Scoop pins an exact URL + hash, so the manifest can only be written
      # once the asset is actually on the release page.
      - name: Point the bucket at the new release
        run: |
          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Skim_${version}_x64-setup.exe"
          curl -fsSL --retry 5 --retry-all-errors -o setup.exe "$url"
          hash="$(sha256sum setup.exe | cut -d ' ' -f 1)"
          rm setup.exe
          # The #/dl.7z fragment is what makes Scoop unpack the NSIS installer
          # with 7-Zip instead of dropping the installer itself into the app dir.
          jq --arg v "$version" --arg u "$url#/dl.7z" --arg h "$hash" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            bucket/skim.json > bucket/skim.json.new
          mv bucket/skim.json.new bucket/skim.json

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Manifest already points at ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "scoop: skim ${TAG#v}"
          git push
